<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bioinformatics Planet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,V=(x,y,z)=>new T.Vector3(x,y,z);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const PAL=[0x00e5ff,0x1de9c6,0x10d876,0x2f6bff,0x9b5cff,0xff2bd6,0xff8a2b,0xff8fc7],pc=i=>PAL[Math.floor(Math.abs(i))%8];
const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
renderer.setClearColor(0,0);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.outputEncoding=T.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(38,1,.1,50);
// reflection environment (never visible as background)
{const es=new T.Scene(),g=new T.SphereGeometry(10,32,16),p=g.attributes.position,cols=[];
for(let i=0;i<p.count;i++){const c=new T.Color(pc((Math.atan2(p.getZ(i),p.getX(i))+3.2)*1.2+p.getY(i)*.3)).multiplyScalar(.5);cols.push(c.r,c.g,c.b)}
g.setAttribute('color',new T.Float32BufferAttribute(cols,3));
es.add(new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide})));
[[0,6,6],[-6,2,4],[6,-3,4],[0,-6,-4]].forEach(q=>{const m=new T.Mesh(new T.PlaneGeometry(5,3),new T.MeshBasicMaterial({color:new T.Color().setScalar(5),side:2}));m.position.set(...q);m.lookAt(0,0,0);es.add(m)});
scene.environment=new T.PMREMGenerator(renderer).fromScene(es).texture}
scene.add(new T.HemisphereLight(0x8fe8ff,0x8a3cff,.6));
const dl=new T.DirectionalLight(0xffffff,1.6);dl.position.set(-3,4,5);scene.add(dl);
const dl2=new T.DirectionalLight(0xff5fd0,.9);dl2.position.set(4,-2,-3);scene.add(dl2);
const tilt=new T.Group(),spin=new T.Group();tilt.add(spin);scene.add(tilt);tilt.rotation.z=.41;

// surface texture: genomic bars, hex grid, cells, glow
function makeTex(){const W=2048,H=1024,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1250');g.addColorStop(.5,'#06284f');g.addColorStop(1,'#2a0f4a');x.fillStyle=g;x.fillRect(0,0,W,H);
x.globalCompositeOperation='lighter';
for(let i=0;i<70;i++){const px=rnd()*W,py=rnd()*H,r=60+rnd()*160,col=new T.Color(pc(i)).getStyle().replace('rgb','rgba').replace(')',',.4)');
[0,-W,W].forEach(d=>{const rg=x.createRadialGradient(px+d,py,0,px+d,py,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(px+d-r,py-r,2*r,2*r)})}
x.strokeStyle='rgba(120,255,240,.16)';x.lineWidth=1.5;const hs=34;
for(let r=0;r<H/(hs*1.5)+1;r++)for(let q=0;q<W/(hs*1.73)+1;q++){const cx=q*hs*1.73+(r%2)*hs*.865,cy=r*hs*1.5;x.beginPath();for(let k=0;k<6;k++){const a=Math.PI/3*k+Math.PI/6;x.lineTo(cx+hs*Math.cos(a),cy+hs*Math.sin(a))}x.closePath();x.stroke()}
const bc=['#00e5ff','#10d876','#ff8a2b','#ff2bd6'];
for(let r=0;r<H/18;r++){let xx=rnd()*30;while(xx<W){const l=10+rnd()*60;if(rnd()<.35){x.fillStyle=bc[Math.floor(rnd()*4)];x.globalAlpha=.55;x.fillRect(xx,r*18,l,5)}xx+=l+rnd()*25}}
x.globalAlpha=1;
for(let i=0;i<14;i++){x.strokeStyle=new T.Color(pc(i)).getStyle().replace('rgb','rgba').replace(')',',.35)');x.lineWidth=2;x.beginPath();const y0=rnd()*H,a=20+rnd()*40,f=.004+rnd()*.01;for(let u=0;u<=W;u+=8)x.lineTo(u,y0+a*Math.sin(u*f+i));x.stroke()}
for(let i=0;i<260;i++){x.strokeStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(rnd()*W,rnd()*H,3+rnd()*9,0,7);x.stroke()}
return new T.CanvasTexture(c)}
const tex=makeTex();tex.encoding=T.sRGBEncoding;tex.anisotropy=8;
spin.add(new T.Mesh(new T.SphereGeometry(1,96,64),new T.MeshStandardMaterial({map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:.7,metalness:.35,roughness:.4})));

// helpers
const M=(c,e=.5,m=.2,r=.25)=>new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,metalness:m,roughness:r});
const sph=(p,r,mat)=>{const m=new T.Mesh(new T.SphereGeometry(r,14,10),mat);m.position.copy(p);spin.add(m);return m};
const cylG=new T.CylinderGeometry(1,1,1,8);
const bond=(a,b,r,mat)=>{const d=b.clone().sub(a),m=new T.Mesh(cylG,mat);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());m.scale.set(r,d.length(),r);spin.add(m)};
const frame=n=>{const t=n.clone().cross(Math.abs(n.y)<.9?V(0,1,0):V(1,0,0)).normalize();return[t,n.clone().cross(t)]};
const fib=(i,n)=>{const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=i*2.39996;return V(Math.cos(a)*r,y,Math.sin(a)*r)};
const set=n=>{const q=new T.Quaternion().setFromEuler(new T.Euler(rnd()*6,rnd()*6,rnd()*6));return Array.from({length:n},(_,i)=>fib(i,n).applyQuaternion(q))};
const tube=(pts,r,mat)=>{const m=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),pts.length*3,r,8),mat);spin.add(m)};

// DNA double helices wrapping the surface
function helix(a,ci,len=1.7){const[b]=frame(a),N=Math.floor(len*36),s1=[],s2=[];
for(let i=0;i<=N;i++){const s=i/N*len,n=a.clone().multiplyScalar(Math.cos(s)).addScaledVector(b,Math.sin(s)),Tg=a.clone().multiplyScalar(-Math.sin(s)).addScaledVector(b,Math.cos(s)),W=n.clone().cross(Tg),ph=i*.45;
const mk=q=>n.clone().multiplyScalar(1.09+.04*Math.sin(ph+q)).addScaledVector(W,.05*Math.cos(ph+q));s1.push(mk(0));s2.push(mk(Math.PI))}
tube(s1,.012,M(pc(ci),.7));tube(s2,.012,M(pc(ci+4),.7));
for(let i=1;i<N;i+=2){bond(s1[i],s2[i],.005,M(pc(i/2+ci+2),.7));if(i%4==1){sph(s1[i],.014,M(pc(ci+1),.9));sph(s2[i],.014,M(pc(ci+5),.9))}}}
set(8).forEach((a,i)=>helix(a,i));

// proteins: rainbow backbone, alpha coil, beta arrows
function protein(n,ci){const[t,b]=frame(n),pts=[];
for(let i=0;i<28;i++){const u=i/27,x=(u-.5)*.5+(rnd()-.5)*.05,y=Math.sin(u*9+ci)*.09+(rnd()-.5)*.03;pts.push(n.clone().addScaledVector(t,x).addScaledVector(b,y).normalize().multiplyScalar(1.05+.03*Math.sin(u*14)))}
const g=new T.TubeGeometry(new T.CatmullRomCurve3(pts),90,.014,8),col=[];
for(let i=0;i<g.attributes.position.count;i++){const c=new T.Color().setHSL((Math.floor(i/9)/91*.85+.5)%1,.9,.55);col.push(c.r,c.g,c.b)}
g.setAttribute('color',new T.Float32BufferAttribute(col,3));
spin.add(new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,emissive:0x151535,metalness:.2,roughness:.3})));
const cp=[];for(let i=0;i<40;i++){const u=i/39;cp.push(n.clone().addScaledVector(t,(u-.5)*.3).addScaledVector(b,.17).normalize().multiplyScalar(1.09).addScaledVector(n,.035*Math.cos(u*50)).addScaledVector(b,.035*Math.sin(u*50)))}
tube(cp,.016,M(pc(ci+1),.6,.4,.15));
for(let j=0;j<3;j++){const m=new T.Mesh(new T.ConeGeometry(.03,.12,8),M(pc(ci+5),.6));m.position.copy(n).addScaledVector(b,-.16+j*.05).normalize().multiplyScalar(1.07);m.quaternion.setFromUnitVectors(V(0,1,0),t);spin.add(m)}}
set(12).forEach((n,i)=>protein(n,i));

// ligands docked in glowing pockets
function ligand(n,ci){const[t,b]=frame(n),c=n.clone().multiplyScalar(1.07),r=[];
for(let k=0;k<6;k++){const a=k*Math.PI/3;r.push(c.clone().addScaledVector(t,Math.cos(a)*.055).addScaledVector(b,Math.sin(a)*.055))}
r.forEach((p,k)=>{sph(p,.014,M(pc(ci+k),.8,.3,.15));bond(p,r[(k+1)%6],.005,M(0xdde8ff,.3,.8,.2))});
[0,3].forEach((k,j)=>{const o=r[k].clone().addScaledVector(r[k].clone().sub(c).normalize(),.05);bond(r[k],o,.005,M(0xdde8ff,.3,.8,.2));sph(o,.02,M(j?0xff2bd6:0xff8a2b,.9))});
const d=new T.Mesh(new T.TorusGeometry(.12,.007,8,48),M(pc(ci+3),1));d.position.copy(c);d.quaternion.setFromUnitVectors(V(0,0,1),n);spin.add(d)}
set(14).forEach((n,i)=>ligand(n,i));

// chromosome X fragments
function chromo(n,ci){const[t,b]=frame(n),c=n.clone().multiplyScalar(1.08);
[.45,-.45].forEach(a=>{const d=t.clone().multiplyScalar(Math.cos(a)).addScaledVector(b,Math.sin(a)).multiplyScalar(.1),p=c.clone().add(d),q=c.clone().sub(d);bond(p,q,.017,M(pc(ci),.6));sph(p,.022,M(pc(ci),.7));sph(q,.022,M(pc(ci),.7))});sph(c,.02,M(0xffffff,.8))}
set(12).forEach((n,i)=>chromo(n,i%2?7:6));

// computational network + data pathways with travelling pulses
const nodes=set(70).map(n=>n.multiplyScalar(1.04)),lp=[];
nodes.forEach((p,i)=>{sph(p,.02,M(pc(i),1));nodes.forEach((q,j)=>{if(j>i&&p.distanceTo(q)<.46)lp.push(p.x,p.y,p.z,q.x,q.y,q.z)})});
const lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute(lp,3));
spin.add(new T.LineSegments(lg,new T.LineBasicMaterial({color:0x40f0ff,transparent:true,opacity:.6,blending:T.AdditiveBlending})));
const pulses=[];
for(let i=0;i<28;i++){const a=nodes[Math.floor(rnd()*70)].clone().normalize(),b=nodes[Math.floor(rnd()*70)].clone().normalize();if(a.distanceTo(b)<.8)continue;
const pts=[];for(let k=0;k<=24;k++){const u=k/24;pts.push(a.clone().lerp(b,u).normalize().multiplyScalar(1.05+.09*Math.sin(Math.PI*u)))}
const cv=new T.CatmullRomCurve3(pts);spin.add(new T.Mesh(new T.TubeGeometry(cv,48,.006,6),M(pc(i+2),.9)));
pulses.push({cv,m:sph(pts[0],.017,M(0xffffff,2)),t:rnd(),s:.06+rnd()*.08})}

// AI / data-processing chips
set(16).forEach((n,i)=>{const g=new T.BoxGeometry(.09,.09,.02),m=new T.Mesh(g,new T.MeshStandardMaterial({color:0x141a33,metalness:.9,roughness:.2}));
m.add(new T.LineSegments(new T.EdgesGeometry(g),new T.LineBasicMaterial({color:pc(i)})));
const cr=new T.Mesh(new T.BoxGeometry(.04,.04,.024),M(pc(i+1),1.2));m.add(cr);
m.position.copy(n).multiplyScalar(1.06);m.quaternion.setFromUnitVectors(V(0,0,1),n);spin.add(m)});

// glass shell + subtle rim
tilt.add(new T.Mesh(new T.SphereGeometry(1.18,96,64),new T.MeshPhysicalMaterial({color:0xbfefff,metalness:0,roughness:.03,transparent:true,opacity:.16,clearcoat:1,clearcoatRoughness:.03,envMapIntensity:1.6,depthWrite:false})));
tilt.add(new T.Mesh(new T.SphereGeometry(1.185,64,48),new T.ShaderMaterial({transparent:true,depthWrite:false,blending:T.AdditiveBlending,
vertexShader:'varying vec3 n,v;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);n=normalize(normalMatrix*normal);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
fragmentShader:'varying vec3 n,v;void main(){float f=pow(1.-max(dot(n,v),0.),3.);vec3 c=mix(vec3(.1,.9,1.),vec3(.9,.2,1.),clamp(n.y*.5+.5+n.x*.3,0.,1.));gl_FragColor=vec4(c*f*.8,f*.8);}'})));

// interaction + loop
let drag=false,lx,ly;const el=renderer.domElement;
el.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId)};
el.onpointermove=e=>{if(!drag)return;spin.rotation.y+=(e.clientX-lx)*.008;tilt.rotation.x=Math.max(-1,Math.min(1,tilt.rotation.x+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY};
el.onpointerup=el.onpointercancel=()=>drag=false;
const size=()=>{const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);cam.aspect=a;cam.position.z=Math.max(5,4.4/a);cam.updateProjectionMatrix()};
addEventListener('resize',size);size();
const clock=new T.Clock();
(function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(!drag)spin.rotation.y+=dt*.15;
pulses.forEach(p=>{p.t=(p.t+dt*p.s*.6)%1;p.m.position.copy(p.cv.getPoint(p.t))});renderer.render(scene,cam)})();
</script></body></html>
